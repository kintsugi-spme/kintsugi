# kube-state-metrics (D0019): traduce in metriche lo stato di Kubernetes (copie pronte, riavvii, nodo dei pod).
# Solo pod e Deployment del namespace `default`, quello dell'app: meno serie, meno memoria.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kintsugi-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kintsugi-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kintsugi-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: osservabilita
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      nodeSelector:
        kintsugi/ruolo: dati
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            - --resources=pods,deployments
            - --namespaces=default
          ports:
            - { name: metriche, containerPort: 8080 }
          # Come nei manifest ufficiali: «vivo?» sulla porta delle metriche (8080), «pronto?» su quella di servizio (8081).
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: metriche }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
spec:
  selector:
    app: kube-state-metrics
  ports:
    - { name: metriche, port: 8080 }
