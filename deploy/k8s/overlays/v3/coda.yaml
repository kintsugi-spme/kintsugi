# RabbitMQ con i dati su un volume (D0002): una sola istanza, volutamente un punto unico di guasto (guasto F3).
# Stessa versione di deploy/compose (D0011). Le credenziali sono valori di prova, validi solo dentro il cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coda-dati
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coda
spec:
  replicas: 1
  # Un solo pod alla volta sul volume: il nuovo parte dopo che il vecchio si è fermato.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coda
  template:
    metadata:
      labels:
        app: coda
    spec:
      # Il nome del nodo di RabbitMQ (`rabbit@coda`) deriva dal nome del computer e RabbitMQ cerca i suoi dati
      # in una cartella con quel nome. Senza questa riga il pod si chiamerebbe come il Deployment più un
      # suffisso casuale che cambia a ogni ricreazione, e i messaggi sul volume non si ritroverebbero (D0002).
      hostname: coda
      # Come db.yaml: il disco local-path nasce sul nodo dove il pod parte la prima volta e non si sposta,
      # quindi la coda parte sempre sul nodo `dati` (D0006, regola rigida). Le altre regole di D0006 sono della #77.
      nodeSelector:
        kintsugi/ruolo: dati
      containers:
        - name: rabbitmq
          image: rabbitmq:4.4.0-alpine
          ports:
            - containerPort: 5672
          env:
            # L'utente `guest` funziona solo da localhost: serve un utente vero.
            - { name: RABBITMQ_DEFAULT_USER, value: kintsugi }
            - { name: RABBITMQ_DEFAULT_PASS, value: kintsugi }
          volumeMounts:
            - name: dati
              mountPath: /var/lib/rabbitmq
          # Si guarda la porta e non si lancia `rabbitmq-diagnostics`: un comando di RabbitMQ eseguito prima che
          # il server sia partito crea `.erlang.cookie` come root e il server non parte più.
          readinessProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 2
            timeoutSeconds: 3
      volumes:
        - name: dati
          persistentVolumeClaim:
            claimName: coda-dati
---
# Indirizzo della coda dentro il cluster: amqp://kintsugi:kintsugi@coda:5672/
apiVersion: v1
kind: Service
metadata:
  name: coda
spec:
  selector:
    app: coda
  ports:
    - port: 5672
