# I worker di V3: leggono gli ordini dalla coda e li salvano nel database (D0002, D0003).
# Le copie sono quelle di `versioni.worker_v3` (vedi kustomization.yaml). Niente sonde: un worker che
# cade si riconosce dall'uscita del container (D0007). Niente Service: nessuno chiama un worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # D0006, come l'API (base/api.yaml): preferisce il nodo `calcolo`, ma può partire sul nodo `dati`.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: kintsugi/ruolo, operator: In, values: [calcolo] }
      containers:
        - name: worker
          image: kintsugi:dev
          imagePullPolicy: Never
          # Richieste e limiti (#79). Numeri misurati con V3 e 10 worker, S = 0,05 s, 100 ordini/s per 2 minuti
          # (report/diario/2026-11-17-risorse.md). Richiesta: poco sopra l'uso tipico. Limite di memoria: circa 4 volte il picco (60 MiB).
          # Il limite di CPU non si raggiunge a carico normale (uso medio 0,02 CPU per worker); serve a non far salire un solo pod senza freno.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          env:
            - { name: MODE, value: async }
            - { name: ROLE, value: worker }
            # Tempo di servizio di ogni ordine (D0018), lo stesso dell'API sincrona: da config/parametri.yaml.
            - name: SERVICE_TIME_S
              valueFrom:
                configMapKeyRef:
                  name: parametri
                  key: SERVICE_TIME_S
            - { name: DATABASE_URL, value: "postgresql://kintsugi:kintsugi@db:5432/kintsugi" }
            - { name: BROKER_URL, value: "amqp://kintsugi:kintsugi@coda:5672/" }
