# L'API di V4 scrive passando da Toxiproxy (#93), che inoltra al Service `-rw` di CloudNativePG
# (overlays/v4a/toxiproxy.json): punta sempre al primario, e dopo un failover l'operatore lo sposta sullo
# standby promosso senza che l'indirizzo cambi.
# `sslmode=disable`: CloudNativePG accetta anche connessioni cifrate e il client le sceglierebbe da solo; la
# base non le ha, e la cifratura aggiungerebbe lavoro solo in V4.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - { name: DATABASE_URL, value: "postgresql://kintsugi:kintsugi@toxiproxy:5432/kintsugi?sslmode=disable" }
