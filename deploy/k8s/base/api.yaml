# L'API sincrona (V1): salva nel database e risponde 201. Gli overlay cambiano modo e numero di copie.
# L'immagine è quella caricata nei nodi con `make immagine`: non si scarica da nessun registro.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: kintsugi:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - { name: MODE, value: sync }
            - name: DEADLINE_S
              valueFrom:
                configMapKeyRef:
                  name: parametri
                  key: DEADLINE_S
            - { name: DATABASE_URL, value: "postgresql://kintsugi:kintsugi@db:5432/kintsugi" }
---
# Punto d'ingresso: NodePort 30080 sul control plane, raggiungibile da http://localhost:8080
# (kind-cluster.yaml inoltra la porta 8080 del Mac alla 30080 del nodo).
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
