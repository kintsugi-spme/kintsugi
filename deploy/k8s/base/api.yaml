# L'API sincrona (V1): salva nel database e risponde 201. Gli overlay cambiano modo e numero di copie.
# L'immagine è quella caricata nei nodi con `make immagine`: non si scarica da nessun registro.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # D0006: l'API preferisce il nodo `calcolo`; se non c'è (guasto F6) può partire sul nodo `dati`. È una
      # preferenza e non un obbligo, a differenza del database (db.yaml). Il control plane ha il taint
      # NoSchedule (`make cluster` lo controlla): nessun pod dell'app ci parte.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: kintsugi/ruolo, operator: In, values: [calcolo] }
      containers:
        - name: api
          image: kintsugi:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - { name: MODE, value: sync }
            - name: DEADLINE_S
              valueFrom:
                configMapKeyRef:
                  name: parametri
                  key: DEADLINE_S
            - { name: DATABASE_URL, value: "postgresql://kintsugi:kintsugi@db:5432/kintsugi" }
          # Richieste e limiti (#79). Numeri misurati con V1 (50 ordini/s), V2 e V3 (100), S = 0,05 s, 2 minuti
          # (report/diario/2026-11-17-risorse.md). Richiesta: poco sopra l'uso tipico. Limite di memoria: circa 4 volte il picco (60 MiB).
          # Il limite di CPU non si raggiunge a carico normale (uso medio 0,05 CPU per copia, 0,15 in V1 con una copia sola); serve a non far salire un solo pod senza freno.
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          # Sonde di D0007: controllano solo che l'API risponda, mai il database (app/api.py). I tre numeri di
          # ognuna (1) sono segnaposti: Kustomize li sostituisce con quelli di config/parametri.yaml (vedi
          # base/kustomization.yaml). Senza segnaposto il valore uscirebbe come testo e Kubernetes lo rifiuterebbe.
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
---
# Punto d'ingresso: NodePort 30080 sul control plane, raggiungibile da http://localhost:8080
# (kind-cluster.yaml inoltra la porta 8080 del Mac alla 30080 del nodo).
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
