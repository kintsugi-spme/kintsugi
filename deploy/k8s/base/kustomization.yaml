# Parte comune a V1-V3 (fase F3, issue #73): il database e un'API sincrona con il Service d'ingresso.
# Gli overlay (deploy/k8s/overlays/) la riprendono e cambiano modo, copie e componenti.
#
# I numeri di config/parametri.yaml arrivano da `parametri.env`, che non si scrive a mano: lo genera
# deploy/k8s/parametri.py, lanciato da `make v1` (in deploy/k8s) prima di ogni avvio. La base non si
# applica da sola: `make v1` applica l'overlay overlays/v1, che la riprende.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - db.yaml
  - api.yaml

# Un'etichetta su tutto ciò che appartiene a Kintsugi, ConfigMap generati compresi: `make togli` cancella
# con questa, qualunque versione sia accesa. Non entra nei selettori dei Deployment e dei Service.
# Kustomize la mette solo sugli oggetti di questa base: un overlay che ne aggiunge (V3: coda e worker) deve
# metterla anche su quelli, altrimenti `make togli` li lascia nel cluster.
labels:
  - pairs:
      app.kubernetes.io/part-of: kintsugi

configMapGenerator:
  # Lo schema è uno solo (D0004, D0005): lo legge anche Compose. PostgreSQL lo esegue una volta sola,
  # quando il volume è vuoto.
  - name: schema
    files:
      - schema.sql
  # Generato da deploy/k8s/parametri.py a partire da config/parametri.yaml (non versionato).
  - name: parametri
    envs:
      - parametri.env

# Le sonde dell'API (D0007) prendono i numeri da parametri.env, nel ConfigMap `parametri`: base/api.yaml non li
# scrive. Si usa la configurazione «veloce»; per il guasto F7 la «standard» (SONDA_STANDARD_*) è già nel
# ConfigMap. Se un valore manca, Kustomize si ferma con un errore invece di lasciare quello predefinito.
replacements:
  - source:
      kind: ConfigMap
      name: parametri
      fieldPath: data.SONDA_VELOCE_PRONTA_S
    targets:
      - select:
          kind: Deployment
          name: api
        fieldPaths:
          - spec.template.spec.containers.[name=api].readinessProbe.periodSeconds
  - source:
      kind: ConfigMap
      name: parametri
      fieldPath: data.SONDA_TIMEOUT_S
    targets:
      - select:
          kind: Deployment
          name: api
        fieldPaths:
          - spec.template.spec.containers.[name=api].readinessProbe.timeoutSeconds
  - source:
      kind: ConfigMap
      name: parametri
      fieldPath: data.SONDA_FALLIMENTI
    targets:
      - select:
          kind: Deployment
          name: api
        fieldPaths:
          - spec.template.spec.containers.[name=api].readinessProbe.failureThreshold
  - source:
      kind: ConfigMap
      name: parametri
      fieldPath: data.SONDA_VELOCE_VIVA_S
    targets:
      - select:
          kind: Deployment
          name: api
        fieldPaths:
          - spec.template.spec.containers.[name=api].livenessProbe.periodSeconds
  - source:
      kind: ConfigMap
      name: parametri
      fieldPath: data.SONDA_TIMEOUT_S
    targets:
      - select:
          kind: Deployment
          name: api
        fieldPaths:
          - spec.template.spec.containers.[name=api].livenessProbe.timeoutSeconds
  - source:
      kind: ConfigMap
      name: parametri
      fieldPath: data.SONDA_FALLIMENTI
    targets:
      - select:
          kind: Deployment
          name: api
        fieldPaths:
          - spec.template.spec.containers.[name=api].livenessProbe.failureThreshold
