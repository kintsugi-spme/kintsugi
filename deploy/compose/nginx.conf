# Bilanciatore di V2 (solo per provare l'app sul computer, vedi v2.yaml).
# `api` è il nome del servizio: Docker restituisce l'indirizzo di tutte e tre le copie e nginx
# le usa a turno.
events {}

http {
    upstream api {
        server api:8000;
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://api;
        }
    }
}
