# V1: una copia dell'API sincrona, che salva direttamente nel database e risponde 201.
# Si avvia con `make v1`, dopo base.yaml.
# L'immagine la costruisce `make` una volta sola (vedi Makefile): qui si usa e basta.
x-app: &app
  image: kintsugi:dev
  pull_policy: never
  stop_grace_period: 10s

services:
  api:
    <<: *app
    environment:
      MODE: sync
      DEADLINE_S: "${DEADLINE_S:?avvia con make v1, che la legge da config/parametri.yaml}"
      SERVICE_TIME_S: ${SERVICE_TIME_S:-0}
      DATABASE_URL: postgresql://kintsugi:kintsugi@db:5432/kintsugi
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
