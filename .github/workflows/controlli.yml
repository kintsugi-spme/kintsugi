name: Controlli

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: controlli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-main:
    name: La PR punta a main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Controlla la base
        run: |
          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "::error::La base è '${{ github.base_ref }}', deve essere 'main' (vedi CONTRIBUTING.md)"
            exit 1
          fi

  test-app:
    name: Test dell'app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    # PostgreSQL e RabbitMQ veri, con le stesse versioni di docker-compose (D0011): servono alle prove
    # di test_db, test_api_sincrona, test_broker e test_worker, che senza indirizzi si saltano.
    # Niente `health-cmd`: un comando di RabbitMQ lanciato prima dell'avvio del server crea
    # `.erlang.cookie` come root e il server non parte; la prontezza si controlla nel passo sotto.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: kintsugi
        ports:
          - 5432:5432
      rabbitmq:
        image: rabbitmq:4.4.0-alpine
        env:
          RABBITMQ_DEFAULT_USER: prova
          RABBITMQ_DEFAULT_PASS: prova
        ports:
          - 5672:5672
    env:
      # Valori di prova: i servizi esistono solo per la durata del job. Le prove svuotano le tabelle.
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/kintsugi
      TEST_BROKER_URL: amqp://prova:prova@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Il Dockerfile usa la stessa versione di Python (D0011)
        run: |
          versione=$(cat ../.python-version)
          grep -q "^FROM python:${versione}-slim@" Dockerfile \
            || { echo "::error::il FROM del Dockerfile non è python:${versione}-slim (vedi .python-version)"; exit 1; }
      - run: pip install -r requirements-dev.txt
      - name: Aspetta PostgreSQL e RabbitMQ e carica lo schema
        run: |
          # Ci si collega davvero (non basta una porta aperta: quella pubblicata da Docker risponde
          # anche prima che il servizio sia pronto) e si riprova per 60 s.
          python - <<'PY'
          import asyncio, os, sys, time
          import aio_pika
          import psycopg

          def aspetta(nome, prova, secondi=60):
              fine = time.monotonic() + secondi
              while True:
                  try:
                      return prova()
                  except Exception as errore:
                      if time.monotonic() > fine:
                          print(f"::error::{nome} non risponde dopo {secondi} s: {type(errore).__name__}: {errore}")
                          sys.exit(1)
                      time.sleep(1)

          def carica_schema():
              # Lo schema è uno solo e sta in deploy/k8s/base (D0004, D0005).
              with psycopg.connect(os.environ["TEST_DATABASE_URL"], autocommit=True) as c:
                  c.execute(open("../deploy/k8s/base/schema.sql", encoding="utf-8").read())

          async def collega_broker():
              connessione = await aio_pika.connect(os.environ["TEST_BROKER_URL"])
              await connessione.close()

          aspetta("PostgreSQL", carica_schema)
          aspetta("RabbitMQ", lambda: asyncio.run(collega_broker()))
          print("PostgreSQL con lo schema e RabbitMQ pronti")
          PY
      - run: pytest -q
      - name: Prove del client (harness/client)
        run: pytest -q ../harness/client
      - name: Prove dello script delle categorie (analysis)
        run: pytest -q ../analysis
      - name: Prove degli script dei guasti (harness/faults)
        run: pytest -q ../harness/faults

  numeri:
    name: Numeri coerenti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install pyyaml
      - name: I numeri nei Markdown coincidono con config/parametri.yaml
        run: make -C docs controlla

  pdf:
    name: I PDF compilano
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install pyyaml
      - name: Genera le macro dai parametri
        run: make -C docs parametri
      - name: Compila documento di architettura e relazione di sintesi
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            main.tex
            main-sintesi.tex
          working_directory: docs
      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: |
            docs/main.pdf
            docs/main-sintesi.pdf

  immagine:
    name: Immagine (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Costruisce l'immagine
        run: docker build -t kintsugi:${GITHUB_SHA::7} app
      - name: Parte come API sincrona, API asincrona e worker
        run: |
          # Ogni API richiede DEADLINE_S; l'API sincrona e il worker anche gli indirizzi: qui non risponde nessuno, ma il processo deve partire lo stesso (D0007).
          for modo in "MODE=sync DEADLINE_S=1.5 DATABASE_URL=postgresql://127.0.0.1:1/k" "MODE=async DEADLINE_S=1.5" "MODE=async ROLE=worker DATABASE_URL=postgresql://127.0.0.1:1/k BROKER_URL=amqp://127.0.0.1:1"; do
            env_args=()
            for kv in $modo; do env_args+=(-e "$kv"); done
            id=$(docker run -d -p 8000:8000 "${env_args[@]}" kintsugi:${GITHUB_SHA::7})
            ok=no
            for i in $(seq 50); do
              if curl -sf -o /dev/null localhost:8000/openapi.json; then ok=yes; break; fi
              sleep 0.2
            done
            # D0016: i segnali dal nodo devono arrivare a uvicorn, non a una shell.
            pid1=$(docker exec "$id" cat /proc/1/comm)
            [ "$pid1" = uvicorn ] || { echo "::error::il processo 1 è $pid1, non uvicorn"; ok=no; }
            docker logs "$id" 2>&1 | grep "avvio:"
            docker rm -f "$id" >/dev/null
            [ "$ok" = yes ] || { echo "::error::$modo non risponde"; exit 1; }
          done
