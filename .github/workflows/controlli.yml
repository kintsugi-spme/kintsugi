name: Controlli

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: controlli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-main:
    name: La PR punta a main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Controlla la base
        run: |
          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "::error::La base è '${{ github.base_ref }}', deve essere 'main' (vedi CONTRIBUTING.md)"
            exit 1
          fi

  test-app:
    name: Test dell'app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Il Dockerfile usa la stessa versione di Python (D0011)
        run: |
          versione=$(cat ../.python-version)
          grep -q "^FROM python:${versione}-slim@" Dockerfile \
            || { echo "::error::il FROM del Dockerfile non è python:${versione}-slim (vedi .python-version)"; exit 1; }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Prove del client (harness/client)
        run: pytest -q ../harness/client

  numeri:
    name: Numeri coerenti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install pyyaml
      - name: I numeri nei Markdown coincidono con config/parametri.yaml
        run: make -C docs controlla

  pdf:
    name: I PDF compilano
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install pyyaml
      - name: Genera le macro dai parametri
        run: make -C docs parametri
      - name: Compila documento di architettura e relazione di sintesi
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            main.tex
            main-sintesi.tex
          working_directory: docs
      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: |
            docs/main.pdf
            docs/main-sintesi.pdf

  immagine:
    name: Immagine (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Costruisce l'immagine
        run: docker build -t kintsugi:${GITHUB_SHA::7} app
      - name: Parte come API sincrona, API asincrona e worker
        run: |
          for modo in "MODE=sync" "MODE=async" "MODE=async ROLE=worker"; do
            env_args=()
            for kv in $modo; do env_args+=(-e "$kv"); done
            id=$(docker run -d -p 8000:8000 "${env_args[@]}" kintsugi:${GITHUB_SHA::7})
            ok=no
            for i in $(seq 50); do
              if curl -sf -o /dev/null localhost:8000/openapi.json; then ok=yes; break; fi
              sleep 0.2
            done
            # D0016: i segnali dal nodo devono arrivare a uvicorn, non a una shell.
            pid1=$(docker exec "$id" cat /proc/1/comm)
            [ "$pid1" = uvicorn ] || { echo "::error::il processo 1 è $pid1, non uvicorn"; ok=no; }
            docker logs "$id" 2>&1 | grep "avvio:"
            docker rm -f "$id" >/dev/null
            [ "$ok" = yes ] || { echo "::error::$modo non risponde"; exit 1; }
          done
